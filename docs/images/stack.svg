<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="900" height="560" rx="18" fill="#0b1830"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#e8c882">EINUX software stack (planned)</text>
  <g font-size="15" fill="#f5f6f8" text-anchor="middle">
    <rect x="60" y="70" width="780" height="70" rx="10" fill="#1d3a66" stroke="#c4a050"/>
    <text x="450" y="98" font-weight="bold" fill="#e8c882">Analyst tools (per profile)</text>
    <text x="450" y="122" font-size="13" fill="#b0bac6">Forensics: Autopsy, Guymager  |  Security: Nmap, Wireshark  |  OSINT: Maltego, SpiderFoot</text>

    <rect x="60" y="152" width="780" height="60" rx="10" fill="#1a3258" stroke="#3a5b8c"/>
    <text x="450" y="178" font-weight="bold">EINUX desktop and branding</text>
    <text x="450" y="199" font-size="13" fill="#b0bac6">XFCE  |  Plymouth boot splash  |  GRUB theme  |  login screen  |  Amharic welcome</text>

    <rect x="60" y="224" width="780" height="60" rx="10" fill="#16294a" stroke="#3a5b8c"/>
    <text x="450" y="250" font-weight="bold">Hardening layer</text>
    <text x="450" y="271" font-size="13" fill="#b0bac6">nftables default-deny  |  AppArmor  |  sysctl  |  fewer services  |  signed updates only</text>

    <rect x="60" y="296" width="780" height="60" rx="10" fill="#122240" stroke="#3a5b8c"/>
    <text x="450" y="322" font-weight="bold">Authentication and data protection</text>
    <text x="450" y="343" font-size="13" fill="#b0bac6">PAM + TOTP 2FA  |  LUKS2 (installed system)  |  panic response (header destruction, test devices only)</text>

    <rect x="60" y="368" width="780" height="60" rx="10" fill="#0f1c36" stroke="#3a5b8c"/>
    <text x="450" y="394" font-weight="bold">Kali Linux (Debian) userland and package repositories</text>
    <text x="450" y="415" font-size="13" fill="#b0bac6">apt / dpkg  |  systemd  |  signed Kali repos</text>

    <rect x="60" y="440" width="780" height="60" rx="10" fill="#0c172d" stroke="#c4a050"/>
    <text x="450" y="466" font-weight="bold" fill="#e8c882">Linux kernel and boot chain</text>
    <text x="450" y="487" font-size="13" fill="#b0bac6">firmware (UEFI/BIOS)  →  GRUB  →  kernel + initramfs  →  systemd</text>
  </g>
  <text x="450" y="535" text-anchor="middle" font-size="12" fill="#7d8a9c">Layers are design targets. Nothing here is released or production-ready.</text>
</svg>
